<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark blue background -->
  <rect width="200" height="200" fill="#0D3B66"/>
  
  <!-- Scales of Justice Logo -->
  <g transform="translate(100, 100)">
    <!-- Star on top -->
    <polygon points="0,-45 8,-22 28,-22 13,-8 20,15 0,0 -20,15 -13,-8 -28,-22 -8,-22" fill="#F4D35E" stroke="none"/>
    
    <!-- Left scale arm -->
    <path d="M -25,10 Q -40,5 -50,-5" stroke="#F4D35E" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-55" cy="-10" r="8" fill="#F4D35E"/>
    
    <!-- Right scale arm -->
    <path d="M 25,10 Q 40,5 50,-5" stroke="#F4D35E" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="55" cy="-10" r="8" fill="#F4D35E"/>
    
    <!-- Center post -->
    <rect x="-8" y="-5" width="16" height="50" fill="#F4D35E" rx="2"/>
    
    <!-- Left scale pan -->
    <rect x="-50" y="35" width="30" height="8" fill="#F4D35E" rx="2"/>
    
    <!-- Right scale pan -->
    <rect x="20" y="35" width="30" height="8" fill="#F4D35E" rx="2"/>
    
    <!-- Base -->
    <rect x="-35" y="50" width="70" height="10" fill="#F4D35E" rx="2"/>
  </g>
</svg>
